name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 0 * * *" # daily, so "coming up" lists drop dates that have passed and stale warnings appear on time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Unit tests (llms.txt builder, IndexNow URL selection, source checker)
        run: node --test scripts/recheck.test.mjs scripts/llms.test.mjs scripts/indexnow.test.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://exams.streamerosai.com

      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000
        continue-on-error: true
      # GitHub's Pages backend sometimes accepts a deployment and never finishes it. Retry once, after the first
      # attempt has fully aborted, instead of waiting for someone to re-run the job by hand.
      - name: Wait for the first attempt to finish aborting
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry the deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000

  # Tell Bing and other IndexNow engines (not Google) which pages the pushed commit changed. Skipped on the daily scheduled
  # rebuild, which has no new commit of its own. A failed ping never fails a deploy.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the parent commit for the diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Submit changed pages
        run: node scripts/indexnow.mjs
        continue-on-error: true
